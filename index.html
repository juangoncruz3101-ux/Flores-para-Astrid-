<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Astrid 💛</title>
    <style>
        body {
            background-color: #fffdf0; /* Fondo crema suave */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(253, 214, 0, 0.15);
            max-width: 450px;
            border: 2px solid #fceb92;
        }
        h1 {
            color: #d4af37; /* Dorado/Amarillo flor */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .flower-icon {
            font-size: 80px;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }
        .heart {
            color: #e2b616;
        }
        /* Estilo para el botón de música */
        .music-btn {
            background-color: #ffe600;
            color: #4a4a4a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        .music-btn:active {
            transform: scale(0.95);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Para Astrid <span class="heart">💛</span></h1>
        
        <!-- Flor Amarilla Gigante Animada -->
        <div class="flower-icon">🌻</div>
        
        <p>Hoy quise regalarte algo que nunca se marchite. Estas flores amarillas virtuales son para recordarte lo especial que eres.</p>
        
        <p>¡Espero que te saque una sonrisa! ✨</p>
        
        <!-- Botón para activar la música -->
        <button class="music-btn" id="playBtn" onclick="toggleMusic()">Escuchar música 🎵</button>
        
        <!-- Reproductor oculto de YouTube con la canción Tiroteo -->
        <div style="display:none;">
            <iframe id="youtubePlayer" width="1" height="1" src="https://youtube.com" frameborder="0" allow="autoplay"></iframe>
        </div>
        
        <div style="font-size: 40px; margin-top: 25px;">🌼✨💛✨🌼</div>
    </div>

    <script>
        var playing = false;
        var player;
        
        // Carga la API de YouTube de forma segura
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtubePlayer');
        }
        
        // Cargar el script de la API
        var tag = document.createElement('script');
        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function toggleMusic() {
            var btn = document.getElementById('playBtn');
            if (!playing) {
                player.playVideo();
                btn.innerText = "Pausar música ⏸️";
                btn.style.backgroundColor = "#e6c300";
                playing = true;
            } else {
                player.pauseVideo();
                btn.innerText = "Escuchar música 🎵";
                btn.style.backgroundColor = "#ffe600";
                playing = false;
            }
        }
    </script>

</body>
</html>
