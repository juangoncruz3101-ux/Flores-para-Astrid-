<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Astrid 💛</title>
    <style>
        body {
            background-color: #fffdf0; /* Fondo crema suave */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(253, 214, 0, 0.15);
            max-width: 450px;
            border: 2px solid #fceb92;
        }
        h1 {
            color: #d4af37; /* Dorado/Amarillo flor */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .flower-icon {
            font-size: 80px;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }
        .heart {
            color: #e2b616;
        }
        /* Contenedor del reproductor de música */
        .music-container {
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid #ffe600;
        }
        .backup-link {
            display: inline-block;
            margin-top: 15px;
            color: #bfa024;
            font-size: 0.9rem;
            text-decoration: underline;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Para Astrid <span class="heart">💛</span></h1>
        
        <!-- Flor Amarilla Gigante Animada -->
        <div class="flower-icon">🌻</div>
        
        <p>Hoy quise regalarte algo que nunca se marchite. Estas flores amarillas virtuales son para recordarte lo especial que eres.</p>
        
        <p>¡Espero que te saque una sonrisa! ✨</p>
        
        <p style="font-size: 1rem; color: #8a8a8a; margin-top: 20px; margin-bottom: 8px;">🎵 Dale play para escuchar "Tiroteo":</p>
        
        <!-- Reproductor con versión permitida de Tiroteo -->
        <div class="music-container">
            <iframe width="100%" height="150" src="https://youtube.com" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <!-- Enlace de respaldo por si el navegador bloquea YouTube -->
        <a href="https://www.youtube.com/watch?v=VEfkNHTjgs8" target="_blank" class="backup-link">¿No se escucha? Toca aquí para abrir en YouTube 🔗</a>
        
        <div style="font-size: 40px; margin-top: 25px;">🌼✨💛✨🌼</div>
    </div>

</body>
</html>
